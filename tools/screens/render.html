<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mount Sheet Sync screens</title>
<style>
  /*FONT_FACES*/
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(120, 84, 40, .38), transparent 60%),
      radial-gradient(800px 600px at 90% 90%, rgba(70, 60, 110, .34), transparent 60%),
      linear-gradient(160deg, #15130f, #1d1a15 55%, #141210);
    width: var(--w); height: var(--h); position: relative; overflow: hidden;
    font-family: "PT Sans", sans-serif;
  }
  .r { position: absolute; box-sizing: border-box; }
  .clip { overflow: hidden; }
  .fs { display: flex; align-items: center; white-space: nowrap; line-height: 1.15; }
  .fs > span { display: block; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .fs.wrap { white-space: pre-wrap; align-items: flex-start; }
  .stand-in {
    display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, .92);
    font: 700 11px "PT Sans Bold", sans-serif; text-shadow: 0 1px 1px rgba(0, 0, 0, .7);
  }
  .tick {
    display: inline-flex; width: 12px; height: 12px; border-radius: 50%; background: #3fb36b; color: #08140c;
    font-size: 9px; font-weight: 700; align-items: center; justify-content: center; vertical-align: -1px;
  }
</style>
</head>
<body>
<script>
// Renders a layout dumped from the addon running in the mock WoW API (tools/tests/test_addon_left.py): every frame,
// texture and line of text with the anchors, colours and fonts the addon gave it. Mount icons are game art, so they
// are drawn as coloured stand-ins with the mount's first letter.
const L = window.LAYOUT, OPT = window.OPT, MASKS = window.MASKS;
document.body.style.setProperty("--w", OPT.w + "px");
document.body.style.setProperty("--h", OPT.h + "px");
const SCREEN = { l: 0, t: 0, r: OPT.w, b: OPT.h };
const LAYERS = { BACKGROUND: 0, BORDER: 1, ARTWORK: 2, OVERLAY: 3, HIGHLIGHT: 4 };
const RADIUS = { Round3: 3, Round6: 6, Pill: 12, Dot: 999 };

function visible(i) {
  for (let x = L[i]; ; x = L[x.parent]) {
    if (!x.shown) return false;
    if (x.parent === "UIParent" || x.parent === null || x.parent === undefined) return true;
  }
}

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

// WoW escape codes: |cffRRGGBB…|r colours, |T…|t textures, |n line breaks
function markup(t) {
  let out = "", open = 0, i = 0;
  while (i < t.length) {
    if (t[i] === "|" && t[i + 1] === "c" && /^[0-9a-fA-F]{8}$/.test(t.substr(i + 2, 8))) {
      out += '<span style="color:#' + t.substr(i + 4, 6) + '">'; open++; i += 10; continue;
    }
    if (t[i] === "|" && t[i + 1] === "r") { if (open) { out += "</span>"; open--; } i += 2; continue; }
    if (t[i] === "|" && t[i + 1] === "n") { out += "\n"; i += 2; continue; }
    if (t[i] === "|" && t[i + 1] === "T") {
      const end = t.indexOf("|t", i);
      const path = t.substring(i + 2, end);
      out += /ReadyCheck-Ready/.test(path) ? '<span class="tick">✓</span>' : "";
      i = end + 2; continue;
    }
    out += esc(t[i]); i++;
  }
  while (open--) out += "</span>";
  return out;
}

function css(c, fallback) {
  if (!c || c[0] === null || c[0] === undefined) return fallback;
  const a = c[3] === null || c[3] === undefined ? 1 : c[3];
  return "rgba(" + c.slice(0, 3).map(v => Math.round(v * 255)).join(",") + "," + a + ")";
}

function fontStyle(x, s) {
  const file = (x.fontFile || "").replace(/^.*\\/, "").replace(/\.ttf$/i, "");
  s.fontFamily = '"' + (OPT.fonts[file] || "PT Sans") + '", sans-serif';
  s.fontSize = (x.fontSize || 12) + "px";
  s.color = css(x.textColor, css(x.fontColor, "#e4dfd2"));
}

const measurer = document.createElement("div");
measurer.style.cssText = "position:absolute;left:-9999px;top:0";
document.body.appendChild(measurer);
function measure(x) {
  const s = document.createElement("span");
  s.style.whiteSpace = "pre"; s.style.lineHeight = "1.15"; s.style.display = "inline-block";
  fontStyle(x, s.style);
  s.innerHTML = markup(x.text || "");
  measurer.appendChild(s);
  const r = s.getBoundingClientRect();
  measurer.removeChild(s);
  return { w: x.w || Math.ceil(r.width), h: x.h || Math.ceil(r.height) };
}

const rects = {};
function px(rect, point) {
  const p = point.toUpperCase();
  return { x: p.includes("LEFT") ? rect.l : p.includes("RIGHT") ? rect.r : (rect.l + rect.r) / 2,
           y: p.includes("TOP") ? rect.t : p.includes("BOTTOM") ? rect.b : (rect.t + rect.b) / 2 };
}
function relRect(x, rel) {
  if (rel === "UIParent") return SCREEN;
  const k = rel === null || rel === undefined ? x.parent : rel;
  return k === "UIParent" ? SCREEN : rect(k);
}
function rect(i) {
  if (i in rects) return rects[i];
  rects[i] = null;  // cycle guard
  const x = L[i];
  let size = { w: x.w || 0, h: x.h || x.extent || 0 };
  if (x.type === "FontString") size = measure(x);
  let res = null;
  if (x.points.length && x.points[0].point === "ALL") {   // SetAllPoints
    const s = relRect(x, x.points[0].rel);
    res = s ? { l: s.l, t: s.t, r: s.r, b: s.b } : null;
  } else if (!x.points.length) {
    if (x.parent === "UIParent") return null;
    const p = rect(x.parent);
    if (!p) return null;
    if (x.checkedMark) res = { l: p.l, t: p.t, r: p.r, b: p.b };
    else if (x.type === "FontString") {
      const cx = (p.l + p.r) / 2, cy = (p.t + p.b) / 2;
      res = { l: cx - size.w / 2, r: cx + size.w / 2, t: cy - size.h / 2, b: cy + size.h / 2 };
    } else return null;
  } else {
    let L_ = null, R_ = null, T_ = null, B_ = null, CX = null, CY = null;
    for (const pt of x.points) {
      const base = relRect(x, pt.rel);
      if (!base) continue;
      const a = px(base, pt.relPoint);
      const X = a.x + pt.x, Y = a.y - pt.y;
      const me = pt.point.toUpperCase();
      if (me.includes("LEFT")) L_ = X; else if (me.includes("RIGHT")) R_ = X; else CX = X;
      if (me.includes("TOP")) T_ = Y; else if (me.includes("BOTTOM")) B_ = Y; else CY = Y;
    }
    let l, r, t, b;
    if (L_ !== null && R_ !== null) { l = L_; r = R_; }
    else if (L_ !== null) { l = L_; r = L_ + size.w; }
    else if (R_ !== null) { r = R_; l = R_ - size.w; }
    else { l = (CX ?? 0) - size.w / 2; r = l + size.w; }
    if (T_ !== null && B_ !== null) { t = T_; b = B_; }
    else if (T_ !== null) { t = T_; b = T_ + size.h; }
    else if (B_ !== null) { b = B_; t = B_ - size.h; }
    else { t = (CY ?? 0) - size.h / 2; b = t + size.h; }
    res = { l, r, t, b };
  }
  rects[i] = res;
  return res;
}

// a ScrollBox whose shown rows go below its bottom edge
function overflow(box) {
  const b = rect(box);
  if (!b) return null;
  let bottom = b.b;
  L.forEach((y, k) => { if (y.parent === box && y.shown && rect(k)) bottom = Math.max(bottom, rect(k).b); });
  return bottom > b.b + 1 ? (b.b - b.t) / (bottom - b.t) : null;
}

function mediaName(x) {
  const m = /Media\\([A-Za-z0-9]+)$/.exec(x.texture || "");
  return m ? m[1] : null;
}

// the name in the same table row: gives a stand-in icon its letter and colour
function rowLabel(x) {
  const texts = L.filter(y => y.parent === x.parent && y.type === "FontString" && y.text && y.shown);
  const mount = texts.find(y => /^\|cffc9a0ff/.test(y.text)) || texts[0];   // the mount's name is purple
  return mount ? mount.text.replace(/\|c[0-9a-fA-F]{8}|\|r|\|T.*?\|t/g, "") || "?" : "?";
}
function standIn(el, x) {
  const label = rowLabel(x);
  let hash = 0;
  for (const ch of label) hash = (hash * 31 + ch.codePointAt(0)) % 360;
  el.classList.add("stand-in");
  el.style.background = "linear-gradient(145deg, hsl(" + hash + ",55%,46%), hsl(" + ((hash + 40) % 360) + ",60%,24%))";
  el.textContent = label[0].toUpperCase();
}

// the frame behind a mount icon: the game draws the icon on it, the picture a stand-in (a done row has its tick instead)
function iconFrame(x) {
  return x.layer === "BORDER" && x.w === 20 && x.h === 20 && x.color &&
    !L.some(y => y.parent === x.parent && y.shown && /ReadyCheck/.test(y.texture || ""));
}

function paintTexture(el, x) {
  const media = mediaName(x);
  if (iconFrame(x)) { standIn(el, x); return true; }
  const tint = css(x.vertex, "#fff");
  if (x.gradient) el.style.background = "linear-gradient(to top, " + css(x.gradient[0]) + ", " + css(x.gradient[1]) + ")";
  else if (x.color && x.color[0] !== null) el.style.background = css(x.color);
  else if (media && media in RADIUS) el.style.background = tint;
  else if (media && MASKS[media]) {
    el.style.background = tint;
    el.style.webkitMaskImage = "url(" + MASKS[media] + ")";
    el.style.webkitMaskSize = "100% 100%";
    if (x.texcoord && x.texcoord[2] === 1 && x.texcoord[3] === 0) el.style.transform = "scaleY(-1)";
  } else if (x.texture) {
    if (/ReadyCheck-Ready/.test(x.texture)) { el.className = "r tick"; el.textContent = "✓"; }
    else standIn(el, x);
  } else return false;
  if (media && media in RADIUS) el.style.borderRadius = Math.min(RADIUS[media], parseFloat(el.style.height) / 2 || RADIUS[media]) + "px";
  return true;
}

// the frame tree, so ScrollBoxes clip their rows and frame levels work like in the game
const nodes = {};
function build(i) {
  if (i in nodes) return nodes[i];
  const x = L[i];
  const pk = x.parent === "UIParent" ? null : x.parent;
  const host = pk === null ? document.body : build(pk);
  const re = rect(i);
  if (!host || !re || !visible(i) || x.layer === "HIGHLIGHT" || (x.checkedMark && !L[x.parent].checked)) { nodes[i] = null; return null; }
  const el = document.createElement("div");
  el.className = "r";
  const o = pk === null ? { l: 0, t: 0 } : rect(pk) || { l: 0, t: 0 };
  el.style.left = (re.l - o.l) + "px"; el.style.top = (re.t - o.t) + "px";
  el.style.width = (re.r - re.l) + "px"; el.style.height = (re.b - re.t) + "px";
  if (x.type === "Texture") {
    el.style.zIndex = (LAYERS[x.layer || (x.checkedMark ? "OVERLAY" : "ARTWORK")] || 0) * 100 + (x.sublevel || 0) + 8;
    if (!paintTexture(el, x)) { nodes[i] = null; return null; }
  } else if (x.type === "FontString") {
    el.style.zIndex = 350;
    el.classList.add("fs");
    fontStyle(x, el.style);
    if (x.wrap === true && x.w) el.classList.add("wrap");
    const j = (x.justify || "CENTER").toUpperCase();
    el.style.justifyContent = j === "LEFT" ? "flex-start" : j === "RIGHT" ? "flex-end" : "center";
    const span = document.createElement("span");
    span.innerHTML = markup(x.text || "");
    el.appendChild(span);
  } else {
    el.style.zIndex = 1000 + (x.level || 0);
    if (x.template === "WowScrollBoxList") el.classList.add("clip");
    if (x.template === "MinimalScrollBar") {
      const part = overflow(x.points[0].rel);   // the game hides the bar while the list fits
      if (part === null) { nodes[i] = null; return null; }
      const thumb = document.createElement("div");
      thumb.className = "r";
      thumb.style.cssText += ";left:1px;right:1px;top:0;border-radius:3px;background:#8a7f68;height:" + Math.round(part * 100) + "%";
      el.appendChild(thumb);
    }
    if (x.type === "Button" && x.text && !x.hasFontString) {
      el.classList.add("fs");
      el.style.justifyContent = "center";
      el.textContent = x.text;
    }
  }
  host.appendChild(el);
  nodes[i] = el;
  return el;
}

window.draw = function () {
  // a tab is as wide as its label: the mock only guesses how wide text is
  L.forEach((x, i) => {
    if (!x.isTab) return;
    const label = L.find(y => y.parent === i && y.type === "FontString");
    if (label) x.w = Math.max(x.w || 0, measure(label).w + 28);
  });
  for (let i = 0; i < L.length; i++) build(i);
  window.WINDOW_RECT = rect(0);
};
</script>
</body>
</html>
