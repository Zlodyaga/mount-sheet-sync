name: Release

# Push a tag like v2.3.0 (it must match "## Version:" in MountSheetSync.toc), or v2.3.0-alpha1 / v2.3.0-beta1 for a
# test version: then the GitHub release is a pre-release (the program's auto-update and the website's "Download"
# button keep the latest stable one) and CurseForge gets the file as Alpha / Beta (BigWigs packager reads the tag):
#   - the program is built on Windows with the built-in C# compiler (and signed through SignPath
#     once that is set up — see the "Sign with SignPath" step),
#   - the full archive (addon + program + sources + guide) and MountSheetSync.exe on its own go to a GitHub release,
#   - the addon alone is packaged by the BigWigs packager and uploaded to CurseForge
#     (only when the CF_API_KEY secret is set and the .toc has "## X-Curse-Project-ID").

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag matches the addon version
        shell: bash
        run: |
          v=$(sed -n 's/^## Version: *//p' MountSheetSync.toc | tr -d '\r')
          base=${GITHUB_REF_NAME%%-*}   # v2.8.0-alpha1 → v2.8.0
          [ "v$v" = "$base" ] || { echo "tag $GITHUB_REF_NAME, toc $v"; exit 1; }
          if [ "$base" != "$GITHUB_REF_NAME" ]; then
            echo "${GITHUB_REF_NAME#*-}" | grep -Eq '^(alpha|beta)[0-9]*$' || { echo "a test tag ends in -alphaN or -betaN"; exit 1; }
          fi
          grep -q "public const string Version = \"$v\"" program/Program.cs || { echo "Program.cs version differs"; exit 1; }
      # v2.8.0-alpha1: the program knows it is a test build (Program.Prerelease = "alpha1") — it shows 2.8.0-alpha1
      # and updates to alpha2, beta1 or the 2.8.0 release when those come out
      - name: Mark a test build
        if: ${{ contains(github.ref_name, '-') }}
        shell: bash
        run: |
          s=${GITHUB_REF_NAME#*-}
          sed -i "s/public const string Prerelease = \"\";/public const string Prerelease = \"$s\";/" program/Program.cs
          grep -q "public const string Prerelease = \"$s\";" program/Program.cs || { echo "Prerelease not set in Program.cs"; exit 1; }
      - name: Build
        shell: cmd
        run: program\build.cmd
      - name: Upload the unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v6
        with:
          name: exe-unsigned
          path: program/MountSheetSync.exe
      # Code signing through SignPath (free for open source, certificate by SignPath Foundation).
      # Turns on by itself once the repository has the variables SIGNPATH_ORGANIZATION_ID and
      # SIGNPATH_PROJECT_SLUG and the secret SIGNPATH_API_TOKEN; until then the exe stays unsigned.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Check the signature
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item signed\MountSheetSync.exe program\MountSheetSync.exe -Force
          $sig = Get-AuthenticodeSignature program\MountSheetSync.exe
          Write-Output "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw 'the exe is not signed' }
      - uses: actions/upload-artifact@v6
        with:
          name: exe
          path: program/MountSheetSync.exe

  archive:
    needs: exe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: exe
          path: built
      - name: Package
        run: tools/package.sh built/MountSheetSync.exe dist
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          v=${v%%-*}
          if [ "$v" != "${GITHUB_REF_NAME#v}" ]; then
            printf '**Test version (%s).** The program does not update to it by itself, and the website keeps offering the latest stable version.\n\n' "${GITHUB_REF_NAME#*-}" > notes.md
          fi
          awk -v h="## $v" '$0==h{on=1;next} /^## /{on=0} on' CHANGELOG.md >> notes.md
          cat notes.md
      # MountSheetSync.exe on its own, always under this name: the website's "Download" button is
      # releases/latest/download/MountSheetSync.exe; on first start the program offers to install itself
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            built/MountSheetSync.exe
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  addon:
    needs: archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-addon-only-{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
