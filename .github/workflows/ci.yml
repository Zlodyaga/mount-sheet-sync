name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build on Windows (built-in csc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build with the C# compiler that ships with Windows (.NET Framework 4.8)
        shell: cmd
        run: program\build.cmd
      - name: Smoke test — the exe starts and reads its translations
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'mss'
          New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content -Path (Join-Path $d 'settings.json') -Value '{"language":"de"}' -Encoding utf8
          $p = Start-Process -FilePath program\MountSheetSync.exe -ArgumentList '--test', '--data', $d -Wait -PassThru
          $log = Get-Content -Path (Join-Path $d 'sync.log') -Raw -Encoding utf8
          Write-Output $log
          if ($p.ExitCode -ne 1 -or $log -notmatch 'Nicht bei Google angemeldet') { throw 'smoke test failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: MountSheetSync-exe
          path: program/MountSheetSync.exe

  tests:
    name: Tests (addon, program under mono, Code.gs, UI)
    runs-on: ubuntu-24.04
    # usually about 15 minutes; a stuck apt mirror should fail the run instead of holding it for six hours
    timeout-minutes: 40
    env:
      MSS_TEST_TMP: ${{ github.workspace }}/test-output
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: |
          # man-db rebuilds its index after every package with man pages (mono has many): minutes for nothing
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          # only what the tests use: mono with Windows Forms (+ libgdiplus for System.Drawing), a font for the
          # windows, Xvfb + xdotool + a tray for the UI walk-throughs, ImageMagick's `import` for screenshots
          sudo apt-get install -y --no-install-recommends mono-devel libmono-system-windows-forms4.0-cil libgdiplus \
            fonts-dejavu-core xvfb xdotool stalonetray imagemagick
          pip install --break-system-packages lupa
      - name: Run tests
        run: tools/run_tests.sh
      # the same packaging as the release (with the test build of the exe): an unlisted file in program/
      # or a broken archive shows up here, not after the tag is pushed
      - name: Package the release archive (dry run)
        run: tools/package.sh "$MSS_TEST_TMP/mss.exe" "$MSS_TEST_TMP/dist"
      - name: Screenshots of the UI tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots
          path: ${{ env.MSS_TEST_TMP }}/ui_*/*.png
          if-no-files-found: ignore
